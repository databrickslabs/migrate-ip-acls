name: Release

# Publishing is fully automated: pushing a version tag (e.g. v0.1.0) builds the sdist + wheel and
# publishes them to PyPI via Trusted Publishing (OIDC) — no stored token, no manual upload step.
#
# One-time setup on PyPI (Project → Publishing, or a "pending publisher" before the first release):
#   Owner:            databrickslabs
#   Repository:       migrate-ip-acls
#   Workflow name:    release.yml
#   Environment name: pypi
on:
  push:
    tags: ["v*"]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Build sdist + wheel
        run: uv build
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
