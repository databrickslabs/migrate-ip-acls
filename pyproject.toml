[project]
name = "databricks-migrate-ip-acls"
# Version is derived from the git tag by hatch-vcs (see [tool.hatch.version]); a release is cut by
# tagging the commit `vX.Y.Z`, which release.yml then publishes to PyPI. Between tags the build
# reports a PEP 440 dev version (e.g. 0.1.1.dev3+g<sha>). Never hardcode it here.
dynamic = ["version"]
description = "Migrate a Databricks workspace's existing IP access list into a context-based ingress (CBI) account network policy, verbatim — a focused, review-gated CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
authors = [{ name = "Andrew Weaver" }]
keywords = ["databricks", "network-policy", "cbi", "ip-access-list", "security", "cli"]
dependencies = [
    # databricks-sdk >= 0.113.0 is required for the Context-Based Ingress (CBI) policy
    # dataclasses (CustomerFacingIngressNetworkPolicy*).
    "databricks-sdk>=0.113.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "questionary>=2.0.1",
    "pandas>=2.0.0",
    # Verify TLS against the OS trust store so corporate-proxy root CAs are honoured by the SDK
    # (see src/dbx_migrate_ip_acls/tls.py).
    "truststore>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/databrickslabs/migrate-ip-acls"
Repository = "https://github.com/databrickslabs/migrate-ip-acls"

[project.scripts]
dbx-migrate-ip-acls = "dbx_migrate_ip_acls.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "black>=24.0.0",
]

[build-system]
# Upper bounds keep the build resolvable behind the internal PyPI mirror, which does not serve the
# very latest hatchling / the setuptools-scm 10.x → vcs-versioning chain. Public PyPI (CI / the
# release workflow) is happy with these too. Relax the ceilings once the mirror approves the newer
# releases.
requires = ["hatchling<1.32", "hatch-vcs>=0.4,<0.5", "setuptools-scm<10"]
build-backend = "hatchling.build"

# Derive the package version from the git tag (single source of truth). Tag `v0.1.0` -> 0.1.0.
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/dbx_migrate_ip_acls"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008"]  # typer uses function-call defaults (Option/Argument) by design

[tool.black]
line-length = 110
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["dbx_migrate_ip_acls"]
branch = true

[tool.coverage.report]
show_missing = true
